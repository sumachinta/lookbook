<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lookbook</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#191816">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Lookbook">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  // Inject the BG-removal module script after Babel has already scanned the DOM,
  // so Babel never sees a type="module" tag and can't mis-transform it.
  setTimeout(function() {
    var s = document.createElement('script');
    s.type = 'module';
    s.textContent = [
      'try {',
      '  const { removeBackground } = await import("https://esm.sh/@imgly/background-removal@1.4.5");',
      '  window.__removeBackground = removeBackground;',
      '} catch(e) {',
      '  console.warn("BG removal library failed to load:", e);',
      '}'
    ].join('\n');
    document.head.appendChild(s);
  }, 0);
</script>
<style>
:root {
  --bg: #faf9f7;
  --bg2: #f2f0ec;
  --bg3: #e8e5df;
  --text: #191816;
  --text2: #7a756d;
  --text3: #b5b0a8;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.14);
  --radius: 6px;
  --radius-lg: 10px;
  --accent: #5060f0;
  --accent-bg: #eef0ff;
  --nav-h: 48px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111110;
    --bg2: #1b1a18;
    --bg3: #252420;
    --text: #eeebe5;
    --text2: #908b82;
    --text3: #4e4a44;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.14);
    --accent-bg: #171a30;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Jost', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg3);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
#root { max-width: 1080px; margin: 0 auto; }

/* ── Base elements ── */
input, select, textarea {
  font-family: inherit; font-size: 13px; color: var(--text);
  background: var(--bg); border: 1px solid var(--border2);
  border-radius: var(--radius); padding: 8px 11px; width: 100%;
  outline: none; transition: border-color 0.15s;
  -webkit-appearance: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--text3); }
button {
  font-family: inherit; cursor: pointer;
  border: 1px solid var(--border2); border-radius: var(--radius);
  background: transparent; color: var(--text);
  padding: 7px 14px; font-size: 13px; font-weight: 400;
  transition: background 0.12s, opacity 0.12s;
  letter-spacing: 0.01em;
}
button:hover { background: var(--bg2); }
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.38; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }
.btn-primary:hover { opacity: 0.86; background: var(--text); }
.btn-ai { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); font-weight: 500; }
.btn-ai:hover { opacity: 0.85; background: var(--accent-bg); }
.btn-danger { color: #c03030; border-color: #c03030; }
.btn-danger:hover { background: #fff0f0; }
.tag {
  display: inline-block; font-size: 11px; padding: 3px 9px;
  border-radius: 20px; background: var(--bg2); color: var(--text2);
  border: 1px solid var(--border); margin: 2px;
  font-weight: 400; letter-spacing: 0.02em;
}
.pill { font-size: 11px; padding: 2px 9px; border-radius: 20px; display: inline-block; font-weight: 500; }
.cat-Top       { background:#deeef9; color:#0c4880; }
.cat-Bottom    { background:#dff0d5; color:#235a08; }
.cat-Shoes     { background:#fae9cc; color:#6b3d08; }
.cat-Outerwear { background:#ece9fd; color:#3c318a; }
.cat-Accessory { background:#fae3ee; color:#7a2040; }
.cat-Dress     { background:#d8f4ec; color:#07523c; }
.cat-Other     { background:#eeebe4; color:#444440; }

/* ── Overlay & modals ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 300; backdrop-filter: blur(6px);
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
@keyframes slideUp { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:translateY(0) } }
.modal {
  background: var(--bg); border-radius: var(--radius-lg);
  border: 1px solid var(--border2); padding: 1.5rem;
  width: 420px; max-height: 92vh; overflow-y: auto;
  box-shadow: 0 30px 90px rgba(0,0,0,0.3);
  animation: slideUp 0.2s ease;
}

/* ── Item detail modal ── */
.detail-modal {
  background: var(--bg);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border2);
  width: min(860px, 95vw);
  max-height: 90vh;
  display: flex;
  overflow: hidden;
  box-shadow: 0 35px 100px rgba(0,0,0,0.35);
  animation: slideUp 0.2s ease;
}
.detail-img-pane {
  flex: 0 0 56%;
  background: var(--bg2);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative; min-height: 440px;
}
.detail-img-pane img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.detail-img-pane .no-photo {
  font-size: 80px; opacity: 0.35;
}
.detail-info-pane {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; min-width: 0;
}
.detail-scroll {
  flex: 1; overflow-y: auto; padding: 2rem 1.75rem 1rem;
}
.detail-scroll h2 {
  font-size: 19px; font-weight: 600; line-height: 1.3;
  margin-bottom: 12px; letter-spacing: -0.01em;
}
.detail-meta-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px; flex-wrap: wrap;
}
.detail-brand {
  font-size: 13px; color: var(--text2); margin-top: 4px; margin-bottom: 14px;
}
.detail-tags { margin-top: 14px; }
.detail-tags-label {
  font-size: 10px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px;
}
.detail-actions {
  padding: 1rem 1.75rem 1.75rem;
  display: flex; gap: 8px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.detail-close {
  position: absolute; top: 12px; right: 12px;
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; padding: 0; border: 1px solid var(--border2);
  background: var(--bg); z-index: 1; flex-shrink: 0;
}
@media (max-width: 640px) {
  .detail-modal { flex-direction: column; max-height: 96vh; }
  .detail-img-pane { flex: 0 0 52vw; min-height: 0; }
}

/* ── Top nav ── */
.top-nav {
  height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.25rem;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.nav-tabs { display: flex; gap: 0; }
.nav-tab {
  padding: 0 16px; height: var(--nav-h);
  font-size: 13px; font-weight: 400;
  border: none; border-bottom: 2px solid transparent; border-radius: 0;
  background: transparent; color: var(--text2);
  letter-spacing: 0.03em; text-transform: uppercase;
  transition: color 0.13s;
  display: flex; align-items: center; gap: 6px;
}
.nav-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
.nav-tab:hover { background: transparent; color: var(--text); }
.settings-btn {
  padding: 5px 10px; font-size: 12px;
  border: 1px solid var(--border2); border-radius: var(--radius);
  color: var(--text2); display: flex; align-items: center; gap: 5px;
}
.settings-badge { font-size: 9px; font-weight: 700; }

/* ── Toolbar (filters + add) ── */
.toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 1.25rem;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
}
.toolbar::-webkit-scrollbar { display: none; }
.cat-chip {
  flex-shrink: 0; padding: 5px 13px; border-radius: 20px;
  font-size: 12px; border: 1px solid var(--border2);
  background: transparent; color: var(--text2);
  white-space: nowrap; transition: all 0.12s;
  letter-spacing: 0.02em;
}
.cat-chip:hover { color: var(--text); background: var(--bg2); }
.cat-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
.cat-chip.active:hover { background: var(--text); }
.toolbar-divider {
  width: 1px; height: 20px; background: var(--border2); flex-shrink: 0; margin: 0 2px;
}
.search-input {
  flex: 1 1 130px; min-width: 100px; max-width: 200px;
  background: var(--bg2) !important; border-color: transparent !important;
  font-size: 12px !important;
}
.search-input:focus { border-color: var(--border2) !important; background: var(--bg) !important; }
.add-btn {
  flex-shrink: 0; padding: 5px 14px;
  font-size: 12px; font-weight: 600;
  background: var(--text); color: var(--bg); border-color: var(--text);
  border-radius: var(--radius);
}
.add-btn:hover { opacity: 0.85; background: var(--text); }
.add-multi-btn {
  flex-shrink: 0; padding: 5px 13px;
  font-size: 12px; font-weight: 500;
  border: 1px solid var(--border2); border-radius: var(--radius);
  color: var(--text2);
}
.add-multi-btn:hover { background: var(--bg2); color: var(--text); }

/* Bulk upload modal */
.bulk-drop-zone {
  border: 2px dashed var(--border2); border-radius: var(--radius-lg);
  padding: 2rem 1rem; text-align: center; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  color: var(--text3); font-size: 13px; line-height: 2;
}
.bulk-drop-zone.drag-over { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
.bulk-preview-grid {
  display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px;
  max-height: 280px; overflow-y: auto; margin-top: 12px;
}
.bulk-thumb {
  aspect-ratio: 3/4; border-radius: var(--radius); overflow: hidden;
  background: var(--bg2); position: relative; border: 1px solid var(--border);
}
.bulk-thumb img { width:100%; height:100%; object-fit:cover; }
.bulk-thumb-status {
  position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; font-size: 11px; font-weight: 600;
  background: rgba(0,0,0,0.5); color: #fff; text-align: center; padding: 4px;
}

/* ── Photo grid ── */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 3px;
  padding: 3px;
}
@media (max-width: 860px) {
  .photo-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .photo-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* ── Grid card (photo-only) ── */
.grid-card {
  cursor: pointer;
  aspect-ratio: 3/4;
  overflow: hidden;
  position: relative;
  background: var(--bg2);
  transition: opacity 0.15s;
}
.grid-card:hover { opacity: 0.88; }
.grid-card img {
  width: 100%; height: 100%; object-fit: cover;
  display: block; transition: transform 0.3s ease;
}
.grid-card:hover img { transform: scale(1.04); }
.grid-card-emoji {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 42px; opacity: 0.35;
}
/* Tiny category indicator — bottom-left corner */
.grid-cat-dot {
  position: absolute; bottom: 6px; left: 6px;
  width: 7px; height: 7px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.8);
  pointer-events: none;
}
.dot-Top       { background: #4a9fdc; }
.dot-Bottom    { background: #52a836; }
.dot-Shoes     { background: #d07a28; }
.dot-Outerwear { background: #7869cc; }
.dot-Accessory { background: #c44e7a; }
.dot-Dress     { background: #28a885; }
.dot-Other     { background: #999; }

/* Selected state for builder */
.grid-card.selected::after {
  content: '✓';
  position: absolute; top: 7px; right: 7px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--text); color: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  border: 1.5px solid rgba(255,255,255,0.5);
}
.grid-card.selected { outline: 2px solid var(--text); outline-offset: -2px; }

/* ── Misc layout ── */
.grid-2 { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
.form-row { margin-bottom: 12px; }
.form-row label { display: block; font-size: 11px; font-weight: 600; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.07em; }
.section-label { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 10px; }
.empty-state { text-align: center; padding: 4rem 1rem; color: var(--text3); font-size: 13px; line-height: 2.2; }
.ai-banner { background: var(--accent-bg); border: 1px solid rgba(80,96,240,0.2); border-radius: var(--radius); padding: 10px 12px; font-size: 12px; color: var(--accent); margin-bottom: 12px; line-height: 1.6; }
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 5px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Builder layout — carousel */
.builder-carousel {
  padding: 1.25rem;
  max-width: 860px;
  margin: 0 auto;
  overflow-y: auto;
  background: var(--bg3);
  min-height: calc(100vh - var(--nav-h) - 1px);
}
.carousel-section { margin-bottom: 20px; }
.carousel-row-label {
  font-size: 10px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.09em;
  margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
}
.carousel-row-label span { font-weight: 400; opacity: 0.7; }
.carousel-strip {
  display: flex; gap: 6px;
  overflow-x: auto; padding: 4px 0 10px;
  scrollbar-width: thin; scrollbar-color: var(--border2) transparent;
}
.carousel-strip::-webkit-scrollbar { height: 3px; }
.carousel-strip::-webkit-scrollbar-track { background: transparent; }
.carousel-strip::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
.carousel-card {
  flex-shrink: 0; width: 84px; height: 110px;
  cursor: pointer; position: relative; overflow: hidden;
  background: var(--bg2); border-radius: var(--radius);
  border: 2px solid transparent;
  transition: border-color 0.12s, transform 0.12s;
}
.carousel-card:hover { transform: translateY(-2px); }
.carousel-card.selected {
  border-color: var(--text);
}
.carousel-card.selected::after {
  content: '✓';
  position: absolute; top: 5px; right: 5px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--text); color: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
}
.carousel-card img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.carousel-card-emoji {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; opacity: 0.35;
}
.builder-form {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 1.25rem;
  margin-top: 8px;
}
.builder-selected-chips {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px;
}
.builder-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 8px 5px 5px; background: var(--bg2);
  border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 11px;
}
.builder-chip-thumb {
  width: 24px; height: 30px; border-radius: 3px; overflow: hidden;
  background: var(--bg3); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 13px;
}
.builder-chip-thumb img { width: 100%; height: 100%; object-fit: cover; }

/* Legacy builder classes kept for EditOutfitModal */
.builder-toolbar {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  background: var(--bg); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}

/* Outfit cards */
.outfit-card {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 1rem;
  transition: border-color 0.15s;
}
.outfit-card:hover { border-color: var(--border2); }

/* Card (for old selectable use) */
.card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; transition: border-color 0.15s; }
.card:hover { border-color: var(--border2); }
.card.selected { border: 2px solid var(--text); }
.img-box { width: 100%; aspect-ratio: 3/4; background: var(--bg2); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 36px; }
.img-box img { width: 100%; height: 100%; object-fit: cover; }

/* Content area */
.content { padding: 0; background: var(--bg3); min-height: calc(100vh - var(--nav-h) - 1px); }
.outfits-content { padding: 1.25rem; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

// ── Supabase ─────────────────────────────────────────────────
// Fill in your project URL and anon key from supabase.com → Project Settings → API
// Also: disable "Confirm email" in Authentication → Settings
const SUPABASE_URL  = 'https://lvkprwjvjgbobiypogqb.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2a3Byd2p2amdib2JpeXBvZ3FiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NTE5MDUsImV4cCI6MjA5NDAyNzkwNX0.-y6hkU1TC1yI_4AZn-HfoPalcTLC6c0Red1QTaT4bkc';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── Shared Cloudinary (all users upload here) ─────────────────
const CLOUD_NAME    = 'ddx2mn7bx';
const UPLOAD_PRESET = 'outfit_uploads';

// ── Data mappers (camelCase ↔ snake_case) ─────────────────────
function rowToItem(r) {
  return { id:r.id, name:r.name, category:r.category, color:r.color||'', brand:r.brand||'', cost:r.cost,
    tags:r.tags||[], photo:r.photo||'', purchaseLink:r.purchase_link||'',
    wornCount:r.worn_count||0, lastWorn:r.last_worn||null };
}
function itemToRow(item, userId) {
  return { user_id:userId, name:item.name, category:item.category, color:item.color||'',
    brand:item.brand||'', cost:item.cost||null, tags:item.tags||[], photo:item.photo||'',
    purchase_link:item.purchaseLink||'', worn_count:item.wornCount||0, last_worn:item.lastWorn||null };
}
function rowToOutfit(r) {
  return { id:r.id, name:r.name||'', itemIds:r.item_ids||[], occasions:r.occasions||[],
    notes:r.notes||'', photo:r.photo||'', wornCount:r.worn_count||0, lastWorn:r.last_worn||null };
}
function outfitToRow(outfit, userId) {
  return { user_id:userId, name:outfit.name||'', item_ids:outfit.itemIds||[],
    occasions:outfit.occasions||[], notes:outfit.notes||'', photo:outfit.photo||'',
    worn_count:outfit.wornCount||0, last_worn:outfit.lastWorn||null };
}

async function seedSampleData(userId) {
  const { data: rows } = await db.from('items')
    .insert(SAMPLE_ITEMS.map(item => itemToRow(item, userId))).select('id');
  if (!rows?.length) return;
  const idMap = {};
  SAMPLE_ITEMS.forEach((item, i) => { idMap[item.id] = rows[i]?.id; });
  await db.from('outfits').insert(SAMPLE_OUTFITS.map(o => ({
    ...outfitToRow(o, userId), item_ids: o.itemIds.map(id => idMap[id]).filter(Boolean)
  })));
}

const DEFAULT_CATEGORIES = ['Top','Bottom','Shoes','Outerwear','Accessory','Dress','Other'];
const CAT_EMOJI  = { Top:'👕', Bottom:'👖', Shoes:'👟', Outerwear:'🧥', Dress:'👗', Accessory:'💍', Other:'👔' };
const COLOR_DICT = [
  'White','Off-White','Cream','Light Gray','Gray','Charcoal','Black',

async function uploadToCloudinary(file, cloudName, uploadPreset) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', uploadPreset);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, { method:'POST', body:formData });
  if (!res.ok) { const e = await res.json().catch(()=>{}); throw new Error(e?.error?.message || `Cloudinary error (${res.status})`); }
  return (await res.json()).secure_url;
}

async function analyzeClothingImage(photoUrl, categories = DEFAULT_CATEGORIES) {
  const { data:{ session } } = await db.auth.getSession();
  const imageSource = photoUrl.startsWith('http')
    ? { type:'url', url:photoUrl }
    : { type:'base64', media_type:photoUrl.split(';')[0].split(':')[1]||'image/jpeg', data:photoUrl.split(',')[1] };
  const res = await fetch(`${SUPABASE_URL}/functions/v1/ai-proxy`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${session?.access_token}` },
    body: JSON.stringify({ model:'claude-opus-4-6', max_tokens:300, messages:[{ role:'user', content:[
      { type:'image', source:imageSource },
      { type:'text', text:`Analyze this clothing item. Reply ONLY with a valid JSON object, no markdown:\n{"name":"short descriptive name","category":"one of: ${categories.join(' ')}","color":"pick the single closest color from this list: ${COLOR_DICT.join(', ')}"}` }
    ]}]})
  });
  if(!res.ok){ const e=await res.json().catch(()=>{}); throw new Error(e?.error?.message||`API error ${res.status}`); }
  const data = await res.json();
  return JSON.parse((data.content?.find(b=>b.type==='text')?.text||'').replace(/```json|```/g,'').trim());
}

async function suggestOutfitOccasions(selectedItems, tagGroups) {
  const { data:{ session } } = await db.auth.getSession();
  const contentBlocks = [];
  for (const item of selectedItems) {
    if (item.photo) {
      const imageSource = item.photo.startsWith('http')
        ? { type:'url', url:item.photo }
        : { type:'base64', media_type:item.photo.split(';')[0].split(':')[1]||'image/jpeg', data:item.photo.split(',')[1] };
      contentBlocks.push({ type:'image', source:imageSource });
    }
  }
  const itemSummary = selectedItems.map(i=>`${i.name} (${i.category}, ${i.color})`).join('; ');
  const groups = tagGroups || DEFAULT_TAG_GROUPS;
  const groupsDesc = groups.map(g => `${g.name}: ${g.tags.join(', ')}`).join('\n');
  const exampleTag = groups[0]?.tags[0] || '💼 Work';
  contentBlocks.push({ type:'text', text:`Outfit items: ${itemSummary}\nChoose 1-3 tags from the groups below. Reply ONLY with a JSON array.\n${groupsDesc}\nExample: ["${exampleTag}"]` });
  const res = await fetch(`${SUPABASE_URL}/functions/v1/ai-proxy`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${session?.access_token}` },
    body: JSON.stringify({ model:'claude-opus-4-6', max_tokens:150, messages:[{ role:'user', content:contentBlocks }]})
  });
  if(!res.ok){ const e=await res.json().catch(()=>{}); throw new Error(e?.error?.message||`API error ${res.status}`); }
  const data = await res.json();
  const parsed = JSON.parse((data.content?.find(b=>b.type==='text')?.text||'[]').replace(/```json|```/g,'').trim());
  const allTags = groups.flatMap(g=>g.tags);
  return parsed.filter(o=>allTags.includes(o));
}

/* ── Login Screen ── */
function LoginScreen({ onLogin }) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [confirm, setConfirm] = useState('');
  const [error, setError] = useState('');
  const [info, setInfo] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setError(''); setInfo(''); setLoading(true);
    try {
      const emailVal = email.trim().toLowerCase();
      if (!emailVal) { setError('Email is required.'); setLoading(false); return; }
      if (!password) { setError('Password is required.'); setLoading(false); return; }
      if (mode === 'login') {
        const { data, error: authErr } = await db.auth.signInWithPassword({ email: emailVal, password });
        if (authErr) { setError('Invalid email or password.'); setLoading(false); return; }
        onLogin(data.user);
      } else {
        if (password.length < 6) { setError('Password must be at least 6 characters.'); setLoading(false); return; }
        if (password !== confirm) { setError('Passwords do not match.'); setLoading(false); return; }
        const { data, error: authErr } = await db.auth.signUp({ email: emailVal, password });
        if (authErr) { setError(authErr.message || 'Registration failed.'); setLoading(false); return; }
        if (!data.session) {
          setInfo('Check your email for a confirmation link. Once verified, come back and sign in.');
          setLoading(false); return;
        }
        onLogin(data.user);
      }
    } catch(e) { setError('Something went wrong. Please try again.'); }
    setLoading(false);
  };

  const onKey = e => { if (e.key === 'Enter') submit(); };

  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', minHeight:'100vh', background:'var(--bg3)', fontFamily:"'Jost', sans-serif" }}>
      <div style={{ background:'var(--bg)', border:'1px solid var(--border2)', borderRadius:'var(--radius-lg)', padding:'2.5rem 2rem', width:340, boxShadow:'0 30px 90px rgba(0,0,0,0.15)', animation:'slideUp 0.2s ease' }}>
        <p style={{ fontSize:20, fontWeight:600, marginBottom:2, letterSpacing:'-0.02em' }}>Lookbook</p>
        <p style={{ fontSize:12, color:'var(--text3)', marginBottom:'1.75rem' }}>Your personal wardrobe guide</p>
        <div style={{ display:'flex', marginBottom:'1.5rem', borderBottom:'1px solid var(--border)' }}>
          {[['login','Sign in'],['register','Create account']].map(([m,label]) => (
            <button key={m} onClick={()=>{ setMode(m); setError(''); setInfo(''); }} style={{
              flex:1, border:'none', borderRadius:0, background:'transparent',
              color: mode===m ? 'var(--text)' : 'var(--text3)',
              fontWeight: mode===m ? 600 : 400,
              borderBottom: mode===m ? '2px solid var(--text)' : '2px solid transparent',
              padding:'8px 0', fontSize:13, letterSpacing:'0.02em', marginBottom:-1
            }}>{label}</button>
          ))}
        </div>
        <div className="form-row">
          <label>Email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={onKey} placeholder="you@example.com" autoFocus />
        </div>
        <div className="form-row">
          <label>Password</label>
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={onKey} placeholder="••••••" />
        </div>
        {mode === 'register' && (
          <div className="form-row">
            <label>Confirm password</label>
            <input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} onKeyDown={onKey} placeholder="••••••" />
          </div>
        )}
        {error && <p style={{ fontSize:12, color:'#c00', marginBottom:10, lineHeight:1.5 }}>{error}</p>}
        {info  && <p style={{ fontSize:12, color:'#2a7', marginBottom:10, lineHeight:1.5 }}>{info}</p>}
        <button className="btn-primary" style={{ width:'100%', padding:'10px', marginTop:4 }} onClick={submit} disabled={loading||!email.trim()||!password}>
          {loading ? <><span className="spinner" style={{ borderColor:'var(--bg)', borderTopColor:'transparent' }}/>…</> : mode==='login' ? 'Sign in' : 'Create account'}
        </button>
        {mode === 'register' && (
          <p style={{ fontSize:11, color:'var(--text3)', marginTop:12, lineHeight:1.6, textAlign:'center' }}>
            A sample wardrobe will be added to help you get started.
          </p>
        )}
      </div>
    </div>
  );
}

/* ── Settings Modal ── */
function SettingsModal({ onClose, currentUser, tagGroups, setTagGroups, categories, setCategories, onSettingsSaved, items, outfits }) {
  const [importing, setImporting] = useState(false);
  const [importDone, setImportDone] = useState(false);
  const [importError, setImportError] = useState('');
  const importRef = useRef();
  const [groups, setGroups] = useState(tagGroups||DEFAULT_TAG_GROUPS);
  const [newGroupName, setNewGroupName] = useState('');
  const [addTagInputs, setAddTagInputs] = useState({});
  const [cats, setCats] = useState(categories||DEFAULT_CATEGORIES);
  const [newCatName, setNewCatName] = useState('');
  const [editingCat, setEditingCat] = useState(null); // index being renamed

  const updateCats = updated => { setCats(updated); setCategories(updated); };
  const deleteCat = i => updateCats(cats.filter((_,j)=>j!==i));
  const renameCat = (i, name) => { const updated=[...cats]; updated[i]=name; updateCats(updated); };
  const addCat = () => { const name=newCatName.trim(); if(!name||cats.includes(name)) return; updateCats([...cats,name]); setNewCatName(''); };

  const updateGroups = updated => { setGroups(updated); setTagGroups(updated); };
  const renameGroup = (gi, name) => updateGroups(groups.map((g,i)=>i===gi?{...g,name}:g));
  const deleteGroup = gi => updateGroups(groups.filter((_,i)=>i!==gi));
  const addTag = gi => {
    const val = (addTagInputs[gi]||'').trim(); if(!val) return;
    updateGroups(groups.map((g,i)=>i===gi?{...g,tags:[...g.tags,val]}:g));
    setAddTagInputs(p=>({...p,[gi]:''}));
  };
  const deleteTag = (gi,ti) => updateGroups(groups.map((g,i)=>i===gi?{...g,tags:g.tags.filter((_,j)=>j!==ti)}:g));
  const addGroup = () => {
    const name = newGroupName.trim(); if(!name) return;
    updateGroups([...groups,{id:Date.now(),name,tags:[]}]);
    setNewGroupName('');
  };

  const handleExport = () => {
    const data = { version:1, exportedAt:new Date().toISOString(), exportedBy:currentUser.email.split('@')[0], items, outfits, tagGroups:groups, categories:cats };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `lookbook-${currentUser.email.split('@')[0]}-${Date.now()}.json`; a.click(); URL.revokeObjectURL(a.href);
  };
  const handleImport = async (e) => {
    const file = e.target.files[0]; if(!file) return;
    setImporting(true); setImportError('');
    try {
      const data = JSON.parse(await file.text());
      const uid = currentUser.id; const idMap = {};
      for (const item of (data.items||[])) {
        const { data:row } = await db.from('items').insert({ user_id:uid, name:item.name, category:item.category, color:item.color||'', brand:item.brand||'', cost:item.cost||null, tags:item.tags||[], photo:item.photo||'', purchase_link:item.purchaseLink||'', worn_count:item.wornCount||0, last_worn:item.lastWorn||null }).select('id').single();
        if(row) idMap[item.id] = row.id;
      }
      for (const outfit of (data.outfits||[])) {
        await db.from('outfits').insert({ user_id:uid, name:outfit.name||'', item_ids:(outfit.itemIds||[]).map(id=>idMap[id]).filter(Boolean), occasions:outfit.occasions||[], notes:outfit.notes||'', photo:outfit.photo||'', worn_count:outfit.wornCount||0, last_worn:outfit.lastWorn||null });
      }
      setImportDone(true); setTimeout(()=>window.location.reload(), 1200);
    } catch(err) { setImportError('Import failed: '+err.message); }
    setImporting(false);
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{ width:380 }} onClick={e=>e.stopPropagation()}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'1.25rem' }}>
          <p style={{ fontWeight:600, fontSize:15, letterSpacing:'-0.01em' }}>Settings</p>
          <button style={{ border:'none', padding:'4px 8px', fontSize:16 }} onClick={onClose}>✕</button>
        </div>
        <hr style={{ border:'none', borderTop:'1px solid var(--border)', margin:'0 0 18px' }} />
        <div>
          <p style={{ fontWeight:600, fontSize:12, marginBottom:4, textTransform:'uppercase', letterSpacing:'0.06em', color:'var(--text2)' }}>Tag Groups</p>
          <p style={{ fontSize:11, color:'var(--text3)', marginBottom:12, lineHeight:1.5 }}>Customize the tags shown when building outfits.</p>
          {groups.map((group, gi) => (
            <div key={group.id||gi} style={{ marginBottom:12, padding:10, background:'var(--bg2)', borderRadius:'var(--radius)', border:'1px solid var(--border)' }}>
              <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:8 }}>
                <input value={group.name} onChange={e=>renameGroup(gi,e.target.value)} style={{ flex:1, fontWeight:600, fontSize:13, padding:'3px 6px' }} />
                <button className="btn-danger" style={{ padding:'2px 8px', fontSize:11, whiteSpace:'nowrap' }} onClick={()=>deleteGroup(gi)}>Delete</button>
              </div>
              <div style={{ display:'flex', flexWrap:'wrap', gap:5, marginBottom:8 }}>
                {group.tags.map((tag,ti)=>(
                  <span key={ti} style={{ display:'inline-flex', alignItems:'center', gap:3, padding:'3px 6px 3px 9px', background:'var(--bg3)', border:'1px solid var(--border2)', borderRadius:20, fontSize:11 }}>
                    {tag}
                    <button style={{ border:'none', padding:'0 2px', fontSize:10, color:'var(--text3)', lineHeight:1, cursor:'pointer' }} onClick={()=>deleteTag(gi,ti)}>✕</button>
                  </span>
                ))}
              </div>
              <div style={{ display:'flex', gap:5 }}>
                <input value={addTagInputs[gi]||''} onChange={e=>setAddTagInputs(p=>({...p,[gi]:e.target.value}))}
                  placeholder="Add tag…" style={{ flex:1, fontSize:12 }}
                  onKeyDown={e=>{ if(e.key==='Enter') addTag(gi); }} />
                <button style={{ padding:'4px 10px', fontSize:12 }} onClick={()=>addTag(gi)}>+</button>
              </div>
            </div>
          ))}
          <div style={{ display:'flex', gap:5, marginTop:4 }}>
            <input value={newGroupName} onChange={e=>setNewGroupName(e.target.value)}
              placeholder="New group name…" style={{ flex:1, fontSize:12 }}
              onKeyDown={e=>{ if(e.key==='Enter') addGroup(); }} />
            <button style={{ padding:'4px 10px', fontSize:12 }} onClick={addGroup}>+ Add group</button>
          </div>
        </div>
        <hr style={{ border:'none', borderTop:'1px solid var(--border)', margin:'18px 0' }} />
        <div>
          <p style={{ fontWeight:600, fontSize:12, marginBottom:4, textTransform:'uppercase', letterSpacing:'0.06em', color:'var(--text2)' }}>Categories</p>
          <p style={{ fontSize:11, color:'var(--text3)', marginBottom:12, lineHeight:1.5 }}>Customize clothing categories used in Wardrobe and Builder.</p>
          <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:10 }}>
            {cats.map((cat, i) => (
              <span key={i} style={{ display:'inline-flex', alignItems:'center', gap:3, padding:'3px 6px 3px 9px', background:'var(--bg2)', border:'1px solid var(--border2)', borderRadius:20, fontSize:12 }}>

                  : <span style={{ cursor:'text' }} onClick={()=>setEditingCat(i)}>{cat}</span>
                }
                <button style={{ border:'none', padding:'0 2px', fontSize:10, color:'var(--text3)', lineHeight:1, cursor:'pointer' }} onClick={()=>deleteCat(i)}>✕</button>
              </span>
            ))}
          </div>
          <div style={{ display:'flex', gap:5 }}>
            <input value={newCatName} onChange={e=>setNewCatName(e.target.value)}
              placeholder="New category…" style={{ flex:1, fontSize:12 }}

            <button style={{ padding:'4px 10px', fontSize:12 }} onClick={addCat}>+</button>
          </div>
        </div>
        <hr style={{ border:'none', borderTop:'1px solid var(--border)', margin:'18px 0' }} />
        <div>
          <p style={{ fontWeight:600, fontSize:12, marginBottom:7, textTransform:'uppercase', letterSpacing:'0.06em', color:'var(--text2)' }}>Data Backup</p>

            <button style={{ flex:1, fontSize:12 }} onClick={handleExport}>↓ Export backup</button>

            </button>
          </div>
          <input ref={importRef} type="file" accept=".json" style={{display:'none'}} onChange={handleImport} />

          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Image resize utility ── */
const resizeImageFile = (file, maxDim = 800) => new Promise(resolve => {
  const img = new Image();
  const blobUrl = URL.createObjectURL(file);
  img.onload = () => {
    URL.revokeObjectURL(blobUrl);
    const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    canvas.toBlob(blob => {
      resolve(new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }));
    }, 'image/jpeg', 0.85);
  };
  img.src = blobUrl;
});

/* ── Item Add/Edit Modal ── */
function ItemModal({ item, onSave, onClose, cloudConfig, tagGroups, categories }) {
  const cats = categories || DEFAULT_CATEGORIES;
  const init = item || { name:'', category:cats[0]||'Top', color:'', tags:[], photo:'', purchaseLink:'' };
  const [form, setForm] = useState({ ...init, tags:Array.isArray(init.tags)?init.tags:[] });
  const [uploading, setUploading] = useState(false);
  const [uploadPct, setUploadPct] = useState(0);
  const [uploadErr, setUploadErr] = useState('');
  const [analyzing, setAnalyzing] = useState(false);
  const [aiError, setAiError] = useState('');
  const [aiDone, setAiDone] = useState(false);
  const [bgRemoving, setBgRemoving] = useState(false);
  const [bgPhase, setBgPhase] = useState('');
  const [bgError, setBgError] = useState('');
  const [removeBg, setRemoveBg] = useState(true);
  const fileRef = useRef();
  const cloudinaryReady = !!(cloudConfig?.cloudName && cloudConfig?.uploadPreset);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const autoFill = async (overridePhoto) => {
    const photo = overridePhoto || form.photo;
    if(!photo) return;
    setAnalyzing(true); setAiError(''); setAiDone(false);
    try {
      const r = await analyzeClothingImage(photo, cats);
      const catFinal = cats.includes(r.category) ? r.category : form.category;
      const updates = { name:r.name||form.name, category:catFinal, color:r.color||form.color };
      let tags = form.tags;
      if (tagGroups?.length) {
        try {
          const tempItem = { name:updates.name, category:catFinal, color:updates.color, photo };
          tags = await suggestOutfitOccasions([tempItem], tagGroups);
        } catch {}
      }
      setForm(f=>({ ...f, ...updates, tags }));
      setAiDone(true);
    } catch(err) { setAiError('AI analysis failed. Please try again.'); }
    setAnalyzing(false);
  };

  const handleFile = async e => {
    const rawFile = e.target.files[0]; if(!rawFile) return;
    setUploadErr(''); setAiDone(false); setBgError('');

    // Resize to max 800px before BG removal or upload (fixes WASM memory limits, saves storage)
    const file = await resizeImageFile(rawFile, 800);

    // Step A: immediate local preview
    const localPreview = await new Promise(res => { const r=new FileReader(); r.onload=ev=>res(ev.target.result); r.readAsDataURL(file); });
    set('photo', localPreview);

    if(!cloudinaryReady) { setUploadErr('⚠ Cloudinary not set up. Photo saved locally only.'); autoFill(localPreview); return; }

    // Step B: background removal (skipped if user unchecked the toggle)
    let fileForUpload = file;
    let transparentBlobUrl = null;
    if(removeBg) {
      setBgRemoving(true); setBgPhase('model');
      try {
        const removeBackground = window.__removeBackground;
        if (!removeBackground) throw new Error('BG removal library not loaded — check console');
        setBgPhase('inference');
        const resultBlob = await removeBackground(file, {
          proxyToWorker: false,
          progress: (key) => { setBgPhase(key.startsWith('fetch') ? 'model' : 'inference'); }
        });
        fileForUpload = new File([resultBlob], 'item.png', { type: 'image/png' });
        transparentBlobUrl = URL.createObjectURL(resultBlob);
        set('photo', transparentBlobUrl);
      } catch(bgErr) {
        const msg = bgErr?.message || String(bgErr);
        console.error('BG removal error:', bgErr);
        setBgError('BG removal failed: ' + msg.slice(0, 120));
      }
      setBgRemoving(false); setBgPhase('');
    }

    // Step C: upload (transparent PNG or original fallback)
    setUploading(true); setUploadPct(20);
    try {
      setUploadPct(50);
      const url = await uploadToCloudinary(fileForUpload, cloudConfig?.cloudName, cloudConfig?.uploadPreset);
      setUploadPct(100);
      set('photo', url);
      if(transparentBlobUrl) URL.revokeObjectURL(transparentBlobUrl);
      autoFill(url);
    } catch(err) { setUploadErr(err.message||'Upload failed.'); }
    setUploading(false); setUploadPct(0);
  };

  const submit = () => {
    if(!form.name.trim()) return;
    onSave({ ...form });
    onClose();
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'1.25rem' }}>
          <p style={{ fontWeight:600, fontSize:15, letterSpacing:'-0.01em' }}>{item?'Edit item':'Add item'}</p>
          <button style={{ border:'none', padding:'4px 8px', fontSize:16 }} onClick={onClose}>✕</button>
        </div>

        <div className="form-row">
          <label>Photo</label>
          <input ref={fileRef} type="file" accept="image/*" style={{ display:'none' }} onChange={handleFile} />
          <div style={{ display:'flex', gap:10, alignItems:'flex-start' }}>
            <div style={{ width:72, height:90, border:'1px solid var(--border2)', background:'var(--bg2)', overflow:'hidden', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', fontSize:28, position:'relative', borderRadius:'var(--radius)' }}>
              {form.photo ? <img src={form.photo} style={{ width:'100%', height:'100%', objectFit:'cover' }} alt="preview" /> : <span>{CAT_EMOJI[form.category]||'👔'}</span>}
              {uploading && <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.4)', display:'flex', alignItems:'center', justifyContent:'center' }}><span className="spinner" style={{ borderColor:'#fff', borderTopColor:'transparent' }}/></div>}
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:6, flex:1 }}>
              <button onClick={()=>fileRef.current.click()} disabled={bgRemoving||uploading}>
                {bgRemoving
                  ? <><span className="spinner"/>{bgPhase==='model'?'Downloading AI model…':'Removing background…'}</>
                  : uploading
                    ? <><span className="spinner"/>Uploading… {uploadPct?`${uploadPct}%`:''}</>
                    : form.photo ? '📷 Change photo' : '📷 Upload photo'}
              </button>
              <label style={{ display:'flex', alignItems:'center', gap:5, fontSize:11, color:'var(--text2)', cursor:'pointer', userSelect:'none' }}>
                <input type="checkbox" checked={removeBg} onChange={e=>setRemoveBg(e.target.checked)} style={{ margin:0 }}/>
                Remove background
              </label>
              {!form.photo && <p style={{ fontSize:10, color:cloudinaryReady?'#39a855':'var(--text3)', lineHeight:1.5 }}>{cloudinaryReady?'☁ Uploads to Cloudinary CDN':'⚠ Cloudinary not configured'}</p>}
              {form.photo && (
                <button className="btn-ai" onClick={()=>autoFill()} disabled={analyzing||uploading}>
                  {analyzing ? <><span className="spinner"/>Analyzing…</> : aiDone ? '✓ Auto-filled · ↺ Re-analyze' : '↺ Re-analyze'}
                </button>
              )}
              {uploadErr && <p style={{ fontSize:10, color:'#c00', lineHeight:1.5 }}>{uploadErr}</p>}
              {bgError && <p style={{ fontSize:10, color:'#c03030', marginTop:4, lineHeight:1.5 }}>{bgError}</p>}
              {aiError && <p style={{ fontSize:10, color:'#c00', lineHeight:1.5 }}>{aiError}</p>}
              {form.photo && <button className="btn-danger" style={{ fontSize:11, padding:'4px' }} onClick={()=>{ set('photo',''); setAiDone(false); setUploadErr(''); }}>Remove photo</button>}
              {form.photo && form.photo.startsWith('http') && <p style={{ fontSize:10, color:'#39a855' }}>☁ On Cloudinary CDN</p>}
            </div>
          </div>
        </div>

        <div className="form-row"><label>Name *</label><input value={form.name} onChange={e=>set('name',e.target.value)} placeholder="e.g. Blue ribbed crop top" autoFocus={!item} /></div>
        <div className="grid-2" style={{ marginBottom:12 }}>
          <div className="form-row" style={{ marginBottom:0 }}><label>Category</label>
            <select value={form.category} onChange={e=>set('category',e.target.value)}>{cats.map(c=><option key={c}>{c}</option>)}</select>
          </div>
          <div className="form-row" style={{ marginBottom:0 }}><label>Color</label>
            <select value={form.color} onChange={e=>set('color',e.target.value)}>
              <option value="">Select color…</option>
              {COLOR_DICT.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        </div>
        <div className="form-row">
          <label>Tags</label>
          <OccasionPicker selected={form.tags} onChange={v=>set('tags',v)} tagGroups={tagGroups} />
        </div>
        <div className="form-row"><label>Purchase link</label><input value={form.purchaseLink||''} onChange={e=>set('purchaseLink',e.target.value)} placeholder="https://…" /></div>
        <div style={{ display:'flex', gap:8, marginTop:'1rem' }}>
          <button className="btn-primary" style={{ flex:1 }} onClick={submit}>{item?'Save changes':'Add item'}</button>
          <button style={{ flex:1 }} onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

/* ── Bulk Upload Modal ── */
function BulkUploadModal({ onClose, onSave, cloudConfig, categories }) {
  const [files, setFiles] = useState([]); // [{file, preview, status, name}]
  const [uploading, setUploading] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const fileRef = useRef();
  const cloudinaryReady = !!(cloudConfig?.cloudName && cloudConfig?.uploadPreset);

  const addFiles = async (fileList) => {
    const images = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    const newEntries = await Promise.all(images.map(async f => {
      const preview = await new Promise(res => { const r=new FileReader(); r.onload=ev=>res(ev.target.result); r.readAsDataURL(f); });
      return { file: f, preview, status: 'pending', name: '' };
    }));
    setFiles(p => [...p, ...newEntries]);
  };

  const onDrop = e => { e.preventDefault(); setDragOver(false); addFiles(e.dataTransfer.files); };
  const onDragOver = e => { e.preventDefault(); setDragOver(true); };
  const onDragLeave = () => setDragOver(false);

  const uploadAll = async () => {
    if (!files.length) return;
    setUploading(true);
    const results = [];
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      if (f.status === 'done') { results.push(null); continue; }
      setFiles(p => p.map((x,j) => j===i ? { ...x, status:'uploading' } : x));
      try {
        let photoUrl = f.preview;
        if (cloudinaryReady) {
          photoUrl = await uploadToCloudinary(f.file, cloudConfig?.cloudName, cloudConfig?.uploadPreset);
        }
        const cats = categories || DEFAULT_CATEGORIES;
        let meta = { name: f.file.name.replace(/\.[^.]+$/,''), category:cats[0]||'Other', color:'' };
        try { meta = await analyzeClothingImage(photoUrl, cats); } catch {}
        const item = { name: meta.name||f.file.name, category: cats.includes(meta.category)?meta.category:(cats[0]||'Other'), color: meta.color||'', tags: [], photo:photoUrl, purchaseLink:'', wornCount:0, lastWorn:null };
        results.push(item);
        setFiles(p => p.map((x,j) => j===i ? { ...x, status:'done', name:item.name } : x));
      } catch(err) {
        results.push(null);
        setFiles(p => p.map((x,j) => j===i ? { ...x, status:'error' } : x));
      }
    }
    const saved = results.filter(Boolean);
    if (saved.length) onSave(saved);
    setUploading(false);
    if (saved.length === files.length || files.every(f=>f.status==='done'||f.status==='error')) {
      setTimeout(onClose, 800);
    }
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{ width:480 }} onClick={e=>e.stopPropagation()}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'1.25rem' }}>
          <p style={{ fontWeight:600, fontSize:15, letterSpacing:'-0.01em' }}>Add multiple items</p>
          <button style={{ border:'none', padding:'4px 8px', fontSize:16 }} onClick={onClose}>✕</button>
        </div>

        {!cloudinaryReady && (
          <div className="ai-banner" style={{ marginBottom:12 }}>⚠ Cloudinary not set up — photos will be saved locally only.</div>
        )}

        <input ref={fileRef} type="file" accept="image/*" multiple style={{ display:'none' }} onChange={e=>addFiles(e.target.files)} />

        <div
          className={`bulk-drop-zone${dragOver?' drag-over':''}`}
          onDrop={onDrop} onDragOver={onDragOver} onDragLeave={onDragLeave}
          onClick={()=>!uploading&&fileRef.current.click()}
        >
          <div style={{ fontSize:28, marginBottom:4 }}>📁</div>
          Drop photos here or click to select
          <br/>
          <span style={{ fontSize:11 }}>Select multiple images at once</span>
        </div>

        {files.length > 0 && (
          <>
            <div className="bulk-preview-grid">
              {files.map((f,i) => (
                <div key={i} className="bulk-thumb">
                  <img src={f.preview} alt="" />
                  {f.status === 'uploading' && <div className="bulk-thumb-status"><span className="spinner" style={{ borderColor:'#fff', borderTopColor:'transparent' }}/></div>}
                  {f.status === 'done'      && <div className="bulk-thumb-status" style={{ background:'rgba(30,160,60,0.7)' }}>✓</div>}
                  {f.status === 'error'     && <div className="bulk-thumb-status" style={{ background:'rgba(180,30,30,0.75)' }}>✕</div>}
                </div>
              ))}
            </div>
            <p style={{ fontSize:11, color:'var(--text3)', marginTop:8, textAlign:'center' }}>
              {files.filter(f=>f.status==='done').length} / {files.length} done
              {files.some(f=>f.status==='error') ? ` · ${files.filter(f=>f.status==='error').length} failed` : ''}
            </p>
          </>
        )}

        <div style={{ display:'flex', gap:8, marginTop:'1.25rem' }}>
          <button className="btn-primary" style={{ flex:1, padding:'10px' }} onClick={uploadAll} disabled={!files.length||uploading}>
            {uploading ? <><span className="spinner" style={{ borderColor:'var(--bg)', borderTopColor:'transparent' }}/>Uploading…</> : `Upload ${files.length} photo${files.length!==1?'s':''}`}
          </button>
          <button style={{ flex:1 }} onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

/* ── Wardrobe Tab ── */
function WardrobeTab({ items, onSaveItem, onDeleteItem, onSaveBulkItems, cloudConfig, categories, tagGroups }) {
  const [modal, setModal] = useState(null);
  const [detail, setDetail] = useState(null);
  const [filterCat, setFilterCat] = useState('All');
  const [search, setSearch] = useState('');
  const [showBulk, setShowBulk] = useState(false);

  const filtered = useMemo(() => items.filter(i => {
    if(filterCat !== 'All' && i.category !== filterCat) return false;
    if(search && ![i.name, i.brand||'', i.color||'', ...(i.tags||[])].join(' ').toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  }), [items, filterCat, search]);

  const cats = categories || DEFAULT_CATEGORIES;
  const grouped = useMemo(() => {
    const showSections = filterCat === 'All' && !search;
    if (!showSections) return null;
    return cats
      .map(cat => ({ cat, items: filtered.filter(i => i.category === cat).sort((a,b)=>colorRank(a.color)-colorRank(b.color)) }))
      .filter(g => g.items.length > 0);
  }, [filtered, filterCat, search, cats]);

  const handleEdit = item => { setDetail(null); setTimeout(()=>setModal(item), 80); };
  const handleDelete = id => { onDeleteItem(id); setDetail(null); };

  return (
    <div className="content">
      {modal && <ItemModal item={modal==='add'?null:modal} onSave={onSaveItem} onClose={()=>setModal(null)} cloudConfig={cloudConfig} tagGroups={tagGroups} categories={cats} />}
      {showBulk && <BulkUploadModal onClose={()=>setShowBulk(false)} onSave={onSaveBulkItems} cloudConfig={cloudConfig} categories={cats} />}
      {detail && <ItemDetailModal item={detail} onClose={()=>setDetail(null)} onEdit={handleEdit} onDelete={handleDelete} tagGroups={tagGroups} />}

      {/* Toolbar */}
      <div className="toolbar">
        <button className={`cat-chip${filterCat==='All'?' active':''}`} onClick={()=>setFilterCat('All')}>All</button>
        {cats.map(c => (
          <button key={c} className={`cat-chip${filterCat===c?' active':''}`} onClick={()=>setFilterCat(c)}>{c}</button>
        ))}
        <div className="toolbar-divider" />
        <input className="search-input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…" />
        <button className="add-multi-btn" onClick={()=>setShowBulk(true)}>+ Add multiple</button>
        <button className="add-btn" onClick={()=>setModal('add')}>+ Add</button>
      </div>

      {/* Grid — sectioned when All, flat when filtered or searching */}
      {filtered.length === 0
        ? <div className="empty-state">
            {items.length === 0
              ? <>No items yet.<br/><span style={{fontSize:12}}>Tap <strong>+ Add</strong> to start building your wardrobe.</span></>
              : <>No items match the filter.</>
            }
          </div>
        : grouped
          ? grouped.map(({ cat, items: catItems }) => (
              <div key={cat}>
                {/* Section divider — thin rule with category label */}
                <div style={{
                  display: 'flex', alignItems: 'center', gap: 10,
                  padding: '14px 14px 8px',
                }}>
                  <span style={{ fontSize: 10, fontWeight: 700, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.1em', whiteSpace: 'nowrap' }}>
                    {cat} <span style={{ fontWeight: 400, opacity: 0.7 }}>· {catItems.length}</span>
                  </span>
                  <div style={{ flex: 1, height: 1, background: 'var(--border)' }} />
                </div>
                <div className="photo-grid" style={{ paddingTop: 0 }}>
                  {catItems.map(item => <GridCard key={item.id} item={item} onClick={setDetail} />)}
                </div>
              </div>
            ))
          : <div className="photo-grid">
              {[...filtered].sort((a,b)=>colorRank(a.color)-colorRank(b.color)).map(item => <GridCard key={item.id} item={item} onClick={setDetail} />)}
            </div>
      }
    </div>
  );
}

/* ── Builder Tab — horizontal carousel ── */
function BuilderTab({ items, onSaveOutfit, tagGroups, categories }) {
  const [selected, setSelected] = useState([]);
  const [occasions, setOccasions] = useState([]);
  const [notes, setNotes] = useState('');
  const [saved, setSaved] = useState(false);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState('');

  const toggle = id => setSelected(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);
  const selectedItems = items.filter(i=>selected.includes(i.id));
  const canSave = selected.length >= 2 && occasions.length > 0;

  const cats = categories || DEFAULT_CATEGORIES;
  // Build category rows — only categories that have items
  const categoryRows = useMemo(() =>
    cats
      .map(cat => ({ cat, catItems: items.filter(i => i.category === cat).sort((a,b)=>colorRank(a.color)-colorRank(b.color)) }))
      .filter(r => r.catItems.length > 0),
    [items, cats]
  );

  const suggestOcc = async () => {
    if(!selectedItems.length) return;
    setAiLoading(true); setAiError('');
    try { const s = await suggestOutfitOccasions(selectedItems, tagGroups); setOccasions(s); }
    catch(e) { setAiError('Could not suggest occasions. Please try again.'); }
    setAiLoading(false);
  };

  const saveOutfit = async () => {
    if(!canSave) return;
    await onSaveOutfit({ itemIds:selected, occasions, notes, wornCount:0, lastWorn:null });
    setSelected([]); setOccasions([]); setNotes('');
    setSaved(true); setTimeout(()=>setSaved(false), 2000);
  };

  if (items.length === 0) {
    return <div className="empty-state">Add items in Wardrobe first.</div>;
  }

  return (

        <div className="form-row">

        {!canSave && <p style={{ fontSize:11, color:'var(--text3)', textAlign:'center', marginTop:6 }}>{selected.length<2?'Select at least 2 pieces':'Pick at least one occasion'}</p>}
      </div>
    </div>
  );
}

/* ── Outfit Collage Modal ── */
const COLLAGE_W = 500, COLLAGE_H = 650;
const PLACEMENT_MAP = {
  Outerwear: { w:200, h:270, x:100, y:60 },
  Top:       { w:190, h:220, x:260, y:80 },
  Bottom:    { w:175, h:270, x:260, y:300 },
  Shoes:     { w:200, h:150, x:40,  y:470 },
  Dress:     { w:200, h:380, x:200, y:60 },
  Accessory: { w:175, h:175, x:30,  y:150 },
  Other:     { w:150, h:150, x:30,  y:150 },
};

function OutfitCollageModal({ outfit, items, cloudConfig, onSave, onClose }) {
  const [placements, setPlacements] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [dragOffset, setDragOffset] = useState({ x:0, y:0 });
  const [exporting, setExporting] = useState(false);
  const [exportErr, setExportErr] = useState('');
  const canvasRef = useRef(null);

  useEffect(() => {
    const outfitItems = items.filter(i => (outfit.itemIds||[]).includes(i.id) && i.photo);
    let accY = 0;
    setPlacements(outfitItems.map(item => {
      const base = PLACEMENT_MAP[item.category] || { w:150, h:150, x:30, y:30 };
      let p = { itemId: item.id, ...base };
      if(item.category === 'Accessory' || item.category === 'Other') {
        p = { ...p, y: base.y + accY };
        accY += base.h + 10;
      }
      return p;
    }));
  }, []);

  const handlePointerDown = (e, itemId) => {
    e.preventDefault();
    const rect = canvasRef.current.getBoundingClientRect();
    const p = placements.find(pl => pl.itemId === itemId);
    if(!p) return;
    setActiveId(itemId);
    setSelectedId(itemId);
    setDragOffset({ x: (e.clientX - rect.left) - p.x, y: (e.clientY - rect.top) - p.y });
    e.currentTarget.setPointerCapture(e.pointerId);
  };

  const zoom = (itemId, factor) => {
    setPlacements(prev => prev.map(pl => {
      if(pl.itemId !== itemId) return pl;
      const newW = Math.max(50, Math.min(COLLAGE_W, Math.round(pl.w * factor)));
      const newH = Math.max(50, Math.min(COLLAGE_H, Math.round(pl.h * factor)));
      return { ...pl, w: newW, h: newH };
    }));
  };

  const handlePointerMove = (e) => {
    if(!activeId) return;
    const rect = canvasRef.current.getBoundingClientRect();
    const p = placements.find(pl => pl.itemId === activeId);
    if(!p) return;
    const x = Math.max(0, Math.min(COLLAGE_W - p.w, (e.clientX - rect.left) - dragOffset.x));
    const y = Math.max(0, Math.min(COLLAGE_H - p.h, (e.clientY - rect.top) - dragOffset.y));
    setPlacements(prev => prev.map(pl => pl.itemId === activeId ? { ...pl, x, y } : pl));
  };

  const handlePointerUp = () => setActiveId(null);

  const handleExport = async () => {
    setExporting(true); setExportErr('');
    try {
      const imgEls = Array.from(canvasRef.current.querySelectorAll('img'));
      const originalSrcs = imgEls.map(el => el.src);
      const blobUrls = await Promise.all(imgEls.map(async el => {
        try {
          const resp = await fetch(el.src, { mode: 'cors' });
          return URL.createObjectURL(await resp.blob());
        } catch { return el.src; }
      }));
      imgEls.forEach((el, i) => { el.src = blobUrls[i]; });
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

      const canvas = await window.html2canvas(canvasRef.current, {
        width: COLLAGE_W, height: COLLAGE_H, scale: 2,
        useCORS: true, allowTaint: false, backgroundColor: '#f8f8f5',
      });

      imgEls.forEach((el, i) => { el.src = originalSrcs[i]; });
      blobUrls.forEach(u => { if(u.startsWith('blob:')) URL.revokeObjectURL(u); });

      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      const file = new File([blob], `collage-${Date.now()}.png`, { type: 'image/png' });
      const url = await uploadToCloudinary(file, cloudConfig.cloudName, cloudConfig.uploadPreset);
      onSave(url);
      onClose();
    } catch(err) {
      setExportErr('Export failed: ' + (err.message || 'unknown error'));
    }
    setExporting(false);
  };

  return (
    <div className="overlay" onClick={onClose} style={{ zIndex: 400 }}>
      <div onClick={e => e.stopPropagation()} style={{
        background: 'var(--bg)', borderRadius: 'var(--radius-lg)',
        border: '1px solid var(--border2)', width: 'min(580px,96vw)',
        maxHeight: '92vh', display: 'flex', flexDirection: 'column',
        boxShadow: '0 25px 80px rgba(0,0,0,0.3)', animation: 'slideUp 0.2s ease'
      }}>
        <div style={{ padding: '1rem 1.25rem', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexShrink: 0 }}>
          <p style={{ fontWeight: 600, fontSize: 14 }}>Create collage</p>
          <button style={{ border: 'none', padding: '4px 8px', fontSize: 16 }} onClick={onClose}>✕</button>
        </div>
        <div style={{ flex: 1, overflowY: 'auto', padding: '1rem', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
          <p style={{ fontSize: 11, color: 'var(--text3)', marginBottom: 10, alignSelf: 'flex-start' }}>Drag to move · tap to select · use − + to resize</p>
          <div
            ref={canvasRef}
            style={{
              width: COLLAGE_W, height: COLLAGE_H,
              background: '#f8f8f5',
              position: 'relative',
              border: '1px solid var(--border)',
              borderRadius: 4,
              overflow: 'hidden',
              cursor: activeId ? 'grabbing' : 'default',
              touchAction: 'none',
              flexShrink: 0,
            }}
            onPointerMove={handlePointerMove}
            onPointerUp={handlePointerUp}
            onPointerLeave={handlePointerUp}
            onClick={e => { if(e.target === canvasRef.current) setSelectedId(null); }}
          >
            {placements.map(p => {
              const item = items.find(i => i.id === p.itemId);
              if(!item?.photo) return null;
              const isSelected = selectedId === p.itemId;
              return (
                <img
                  key={p.itemId}
                  src={item.photo}
                  alt={item.name}
                  draggable={false}
                  onPointerDown={e => handlePointerDown(e, p.itemId)}
                  style={{
                    position: 'absolute',
                    left: p.x, top: p.y,
                    width: p.w, height: p.h,
                    objectFit: 'contain',
                    cursor: activeId === p.itemId ? 'grabbing' : 'grab',
                    userSelect: 'none',
                    zIndex: isSelected ? 10 : 1,
                    outline: isSelected ? '2px solid var(--accent)' : 'none',
                    outlineOffset: 2,
                    filter: activeId === p.itemId ? 'drop-shadow(0 4px 12px rgba(0,0,0,0.25))' : 'none',
                    transition: activeId === p.itemId ? 'none' : 'filter 0.15s',
                  }}
                />
              );
            })}
          </div>
          {selectedId && (() => {
            const selItem = items.find(i => i.id === selectedId);
            return (
              <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:10, width:'100%', maxWidth:COLLAGE_W }}>
                <span style={{ fontSize:11, color:'var(--text2)', flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                  {selItem?.name || 'Item'}
                </span>
                <button onClick={() => zoom(selectedId, 0.85)} style={{ border:'1px solid var(--border2)', borderRadius:4, padding:'3px 14px', fontSize:18, background:'var(--bg)', cursor:'pointer', lineHeight:1 }}>−</button>
                <button onClick={() => zoom(selectedId, 1.18)} style={{ border:'1px solid var(--border2)', borderRadius:4, padding:'3px 14px', fontSize:18, background:'var(--bg)', cursor:'pointer', lineHeight:1 }}>+</button>
              </div>
            );
          })()}
        </div>
        <div style={{ padding: '1rem 1.25rem', borderTop: '1px solid var(--border)', display: 'flex', flexDirection: 'column', gap: 8, flexShrink: 0 }}>
          {exportErr && <p style={{ fontSize: 11, color: '#c00', textAlign: 'center' }}>{exportErr}</p>}
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn-primary" style={{ flex: 1 }} onClick={handleExport} disabled={exporting}>
              {exporting ? <><span className="spinner"/>Saving…</> : 'Save collage'}
            </button>
            <button style={{ flex: 1 }} onClick={onClose}>Cancel</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Edit Outfit Modal ── */
function EditOutfitModal({ outfit, items, onSave, onClose, cloudConfig, tagGroups, categories }) {
  const [selected, setSelected] = useState(outfit.itemIds||[]);
  const [occasions, setOccasions] = useState(outfit.occasions||[]);
  const [notes, setNotes] = useState(outfit.notes||'');
  const [photo, setPhoto] = useState(outfit.photo||'');
  const [uploading, setUploading] = useState(false);
  const [uploadErr, setUploadErr] = useState('');
  const [filterCat, setFilterCat] = useState('All');
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState('');
  const [showCollage, setShowCollage] = useState(false);
  const photoRef = useRef(null);
  const cloudinaryReady = !!(cloudConfig?.cloudName && cloudConfig?.uploadPreset);
  const toggle = id => setSelected(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const filtered = filterCat==='All'?items:items.filter(i=>i.category===filterCat);
  const selectedItems = items.filter(i=>selected.includes(i.id));
  const canSave = selected.length>=2 && occasions.length>0;
  const handleOutfitPhoto = async e => {
    const rawFile = e.target.files?.[0]; if(!rawFile) return;
    setUploadErr('');
    const file = await resizeImageFile(rawFile, 800);
    const localUrl = URL.createObjectURL(file);
    if(!cloudinaryReady) { setPhoto(localUrl); setUploadErr('⚠ Cloudinary not set up — photo saved locally only.'); return; }
    setUploading(true);
    try { const url = await uploadToCloudinary(file, cloudConfig?.cloudName, cloudConfig?.uploadPreset); setPhoto(url); }
    catch(err) { setUploadErr('Upload failed. ' + err.message); }
    setUploading(false);
    e.target.value = '';
  };
  const suggestOcc = async () => {
    if(!selectedItems.length) return;
    setAiLoading(true); setAiError('');
    try { setOccasions(await suggestOutfitOccasions(selectedItems, tagGroups)); }
    catch(e) { setAiError('Could not suggest occasions. Please try again.'); }
    setAiLoading(false);
  };
  const submit = () => {
    if(!canSave) return;
    onSave({ ...outfit, itemIds:selected, occasions, notes, photo });
    onClose();
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{ background:'var(--bg)', borderRadius:'var(--radius-lg)', border:'1px solid var(--border2)', width:'min(900px,96vw)', maxHeight:'92vh', overflow:'hidden', display:'flex', flexDirection:'column', boxShadow:'0 25px 80px rgba(0,0,0,0.3)', animation:'slideUp 0.2s ease' }}>
        <div style={{ padding:'1rem 1.25rem', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center', flexShrink:0 }}>
          <p style={{ fontWeight:600, fontSize:14, letterSpacing:'-0.01em' }}>Edit outfit</p>
          <button style={{ border:'none', padding:'4px 8px', fontSize:16 }} onClick={onClose}>✕</button>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'minmax(0,1.6fr) minmax(0,1fr)', gap:0, overflow:'hidden', flex:1 }}>
          <div style={{ padding:'1rem', borderRight:'1px solid var(--border)', overflowY:'auto' }}>
            <div style={{ display:'flex', gap:8, marginBottom:10, alignItems:'center' }}>
              <p className="section-label" style={{ margin:0, flex:1 }}>Pieces</p>
              <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} style={{ width:'auto', fontSize:12, padding:'4px 8px' }}>
                <option value="All">All</option>
                {(categories||DEFAULT_CATEGORIES).map(c=><option key={c}>{c}</option>)}
              </select>
              <p style={{ fontSize:11, color:'var(--text3)' }}>{selected.length} selected</p>
            </div>
            <div className="grid-3">{filtered.map(item=><GridCard key={item.id} item={item} selectable selected={selected.includes(item.id)} onSelect={()=>toggle(item.id)} />)}</div>
          </div>
          <div style={{ padding:'1rem 1.25rem', overflowY:'auto' }}>
            <p className="section-label">Selected</p>
            {selectedItems.length===0 ? <p style={{ fontSize:12, color:'var(--text3)', marginBottom:12 }}>None selected.</p>
              : <div style={{ display:'flex', flexDirection:'column', gap:6, marginBottom:14 }}>
                  {selectedItems.map(item=>(
                    <div key={item.id} style={{ display:'flex', alignItems:'center', gap:8, padding:'6px 8px', background:'var(--bg2)', borderRadius:'var(--radius)', border:'1px solid var(--border)' }}>
                      <div style={{ width:30, height:38, borderRadius:'var(--radius)', overflow:'hidden', flexShrink:0, background:'var(--bg3)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:15 }}>
                        {item.photo ? <img src={item.photo} style={{ width:'100%', height:'100%', objectFit:'cover' }} alt="" /> : CAT_EMOJI[item.category]}
                      </div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <p style={{ fontSize:12, fontWeight:500, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.name}</p>
                        <p style={{ fontSize:10, color:'var(--text2)' }}>{item.color} · {item.category}</p>
                      </div>
                      <button style={{ padding:'2px 6px', fontSize:11, border:'none', color:'var(--text3)' }} onClick={()=>toggle(item.id)}>✕</button>
                    </div>
                  ))}
                </div>
            }
            <div style={{ borderTop:'1px solid var(--border)', paddingTop:12 }}>
              <div className="form-row">
                <label style={{ display:'flex', gap:5, alignItems:'center' }}>Outfit photo <span style={{ fontWeight:400, fontSize:10, color:'var(--text3)', textTransform:'none', letterSpacing:0 }}>optional</span></label>
                <input ref={photoRef} type="file" accept="image/*" style={{ display:'none' }} onChange={handleOutfitPhoto} />

                  <div style={{ position:'relative', marginTop:6 }}>
                    <img src={photo} style={{ width:'100%', height:140, objectFit:'cover', borderRadius:'var(--radius)', border:'1px solid var(--border)' }} alt="" />
                    <button style={{ position:'absolute', top:6, right:6, padding:'2px 7px', fontSize:11, background:'rgba(0,0,0,0.55)', color:'#fff', border:'none', borderRadius:4, cursor:'pointer' }} onClick={()=>setPhoto('')}>✕</button>
                  </div>

                  <button style={{ width:'100%', padding:'10px', fontSize:12, border:'1px dashed var(--border2)', borderRadius:'var(--radius)', background:'var(--bg2)', color:'var(--text2)', cursor:'pointer', marginTop:6 }} onClick={()=>photoRef.current?.click()} disabled={uploading}>
                    {uploading ? <><span className="spinner"/> Uploading…</> : '+ Add your styled photo'}
                  </button>
                )}
                {uploadErr && <p style={{ fontSize:10, color:'#c00', marginTop:3 }}>{uploadErr}</p>}
                <button
                  onClick={() => setShowCollage(true)}
                  disabled={items.filter(i => (selected||[]).includes(i.id) && i.photo).length === 0}
                  style={{ width:'100%', marginTop:6, fontSize:12, padding:'7px',
                           border:'1px solid var(--border2)', borderRadius:'var(--radius)',
                           background:'var(--bg2)', color:'var(--text2)', cursor:'pointer' }}
                >
                  🖼 Create collage
                </button>
              </div>
              <div className="form-row">
                {selectedItems.length>0 && (
                  <div style={{ display:'flex', justifyContent:'flex-end', marginBottom:6 }}>
                    <button className="btn-ai" style={{ padding:'3px 9px', fontSize:11 }} onClick={suggestOcc} disabled={aiLoading}>{aiLoading?<><span className="spinner"/>…</>:'✨ AI'}</button>
                  </div>
                )}
                <OccasionPicker selected={occasions} onChange={setOccasions} tagGroups={tagGroups} />
                {aiError && <p style={{ fontSize:10, color:'#c00', marginTop:4 }}>{aiError}</p>}
              </div>
              <div className="form-row">
                <label>Notes</label>
                <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Tips…" style={{ resize:'vertical', minHeight:48 }} />
              </div>
              <div style={{ display:'flex', gap:8 }}>
                <button className="btn-primary" style={{ flex:1, padding:'9px' }} onClick={submit} disabled={!canSave}>Save changes</button>
                <button style={{ flex:1, padding:'9px' }} onClick={onClose}>Cancel</button>
              </div>
              {!canSave && <p style={{ fontSize:10, color:'var(--text3)', textAlign:'center', marginTop:5 }}>{selected.length<2?'Select ≥ 2 pieces':'Pick an occasion'}</p>}
            </div>
          </div>
        </div>
      </div>
      {showCollage && (
        <OutfitCollageModal
          outfit={{ ...outfit, itemIds: selected }}
          items={items}
          cloudConfig={cloudConfig}
          onSave={url => { setPhoto(url); setShowCollage(false); }}
          onClose={() => setShowCollage(false)}
        />
      )}
    </div>
  );
}

    <div className="content">
