                          <div key={item.id} style={{ width:62, height:78, background:'var(--bg2)', borderRadius:'var(--radius)', border:'1px solid var(--border)', overflow:'hidden', display:'flex', alignItems:'center', justifyContent:'center' }}>
                            {item.photo ? <img src={item.photo} style={{ width:'100%', height:'100%', objectFit:'cover' }} alt="" onError={e=>e.target.style.display='none'} /> : <span style={{ fontSize:24 }}>{CAT_EMOJI[item.category]||'👔'}</span>}
                          </div>
                        ))}
                      </div>
                      <button title="Log as worn today" style={{ position:'absolute', top:8, right:8, width:28, height:28, fontSize:14, fontWeight:700, background:'var(--bg)', color:'var(--text)', border:'1px solid var(--border2)', borderRadius:'50%', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }} onClick={e=>{e.stopPropagation(); onLogWear(outfit);}}>+</button>
                    </div>

                    {/* Expanded detail */}
                    {isOpen && (
                      <div style={{ padding:'10px 12px' }} onClick={e=>e.stopPropagation()}>
                        {(outfit.occasions||[]).length > 0 && (
                          <div style={{ display:'flex', flexWrap:'wrap', gap:5, marginBottom:6 }}>
                            {(outfit.occasions||[]).map(occ=>(
                              <span key={occ} style={{ fontSize:12, fontWeight:600, padding:'3px 10px', borderRadius:20, background:'var(--text)', color:'var(--bg)' }}>{occ}</span>
                            ))}
                          </div>
                        )}
                        <p style={{ fontSize:11, color:'var(--text3)', marginBottom:4 }}>{oi.length} pieces · {cats.join(', ')}</p>
                        {(outfit.wornCount > 0) && (
                          <p style={{ fontSize:10, color:'var(--text3)', marginBottom:6 }}>Worn {outfit.wornCount}×{outfit.lastWorn ? ` · ${new Date(outfit.lastWorn).toLocaleDateString(undefined,{month:'short',day:'numeric'})}` : ''}</p>
                        )}
                        {outfit.notes && <p style={{ fontSize:11, color:'var(--text2)', fontStyle:'italic', lineHeight:1.6, marginBottom:8 }}>{outfit.notes}</p>}
                        <div style={{ display:'flex', gap:8, paddingTop:8, borderTop:'1px solid var(--border)' }}>
                          <button style={{ flex:1, padding:'6px 9px', fontSize:11 }} onClick={()=>setEditingOutfit(outfit)}>Edit</button>
                          <button className="btn-danger" style={{ flex:1, padding:'6px 9px', fontSize:11 }} onClick={()=>onDeleteOutfit(outfit.id)}>Delete</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
        }
      </div>
    </div>
  );
}

/* ── Main App (mounted after login) ── */
function MainApp({ currentUser, onLogout }) {
  const [tab, setTab] = useState('wardrobe');
  const [items, setItems] = useState([]);
  const [outfits, setOutfits] = useState([]);
  const [tagGroups, setTagGroups] = useState(DEFAULT_TAG_GROUPS);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [cloudConfig] = useState({ cloudName:CLOUD_NAME, uploadPreset:UPLOAD_PRESET });
  const [hasCloud] = useState(true);
  const [showSettings, setShowSettings] = useState(false);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    async function load() {
      const uid = currentUser.id;
      const [itemsRes, outfitsRes, tagRes, catRes, settingsRes] = await Promise.all([
        db.from('items').select('*').eq('user_id', uid).order('created_at'),
        db.from('outfits').select('*').eq('user_id', uid).order('created_at'),
        db.from('tag_groups').select('*').eq('user_id', uid).order('sort_order'),
        db.from('categories').select('list').eq('user_id', uid).maybeSingle(),
        db.from('user_settings').select('*').eq('user_id', uid).maybeSingle(),
      ]);
      let itemRows = itemsRes.data || [];
      if (!itemRows.length) {
        await seedSampleData(uid);
        const { data: seeded } = await db.from('items').select('*').eq('user_id', uid).order('created_at');
        itemRows = seeded || [];
      }
      setItems(itemRows.map(rowToItem));
      setOutfits((outfitsRes.data||[]).map(rowToOutfit));
      if (tagRes.data?.length) setTagGroups(tagRes.data);
      if (catRes.data?.list) setCategories(catRes.data.list);
      const s = settingsRes.data;
      setLoading(false);
    }
    load();
  }, [currentUser.id]);

  // ── Centralized write handlers ────────────────────────────
  const handleSaveItem = async (formData) => {
    if (formData.id) {
      const { data:row } = await db.from('items').update(itemToRow(formData, currentUser.id)).eq('id', formData.id).select().single();
      if (row) setItems(p => p.map(i => i.id===row.id ? rowToItem(row) : i));
    } else {
      const { data:row } = await db.from('items').insert(itemToRow(formData, currentUser.id)).select().single();
      if (row) setItems(p => [...p, rowToItem(row)]);
    }
  };
  const handleDeleteItem = async (id) => {
    await db.from('items').delete().eq('id', id);
    setItems(p => p.filter(i => i.id !== id));
  };
  const handleSaveBulkItems = async (newItems) => {
    const { data:rows } = await db.from('items').insert(newItems.map(item => itemToRow(item, currentUser.id))).select();
    if (rows) setItems(p => [...p, ...rows.map(rowToItem)]);
  };
  const handleSaveOutfit = async (formData) => {
    if (formData.id) {
      const { data:row } = await db.from('outfits').update(outfitToRow(formData, currentUser.id)).eq('id', formData.id).select().single();
      if (row) setOutfits(p => p.map(o => o.id===row.id ? rowToOutfit(row) : o));
    } else {
      const { data:row } = await db.from('outfits').insert(outfitToRow(formData, currentUser.id)).select().single();
      if (row) setOutfits(p => [...p, rowToOutfit(row)]);
    }
  };
  const handleDeleteOutfit = async (id) => {
    await db.from('outfits').delete().eq('id', id);
    setOutfits(p => p.filter(o => o.id !== id));
  };
  const handleLogWear = async (outfit) => {
    const now = new Date().toISOString();
    const newCount = (outfit.wornCount||0) + 1;
    await db.from('outfits').update({ worn_count:newCount, last_worn:now }).eq('id', outfit.id);
    setOutfits(p => p.map(o => o.id===outfit.id ? {...o, wornCount:newCount, lastWorn:now} : o));
    const toUpdate = items.filter(i => outfit.itemIds.includes(i.id));
    await Promise.all(toUpdate.map(i => db.from('items').update({ worn_count:(i.wornCount||0)+1, last_worn:now }).eq('id', i.id)));
    setItems(p => p.map(i => outfit.itemIds.includes(i.id) ? {...i, wornCount:(i.wornCount||0)+1, lastWorn:now} : i));
  };
  const handleSetTagGroups = async (updated) => {
    setTagGroups(updated);
    await db.from('tag_groups').delete().eq('user_id', currentUser.id);
    if (updated.length) await db.from('tag_groups').insert(updated.map((g,i) => ({ user_id:currentUser.id, name:g.name, tags:g.tags, sort_order:i })));
  };
  const handleSetCategories = async (updated) => {
    setCategories(updated);
    await db.from('categories').upsert({ user_id:currentUser.id, list:updated });
  };
  const handleSettingsSaved = () => {};

  const TABS = [{ id:'wardrobe', label:'Wardrobe' }, { id:'builder', label:'Builder' }, { id:'outfits', label:'Outfits' }];
  const displayName = currentUser.email.split('@')[0];

  if (loading) return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', minHeight:'100vh', background:'var(--bg3)' }}>
      <span className="spinner" style={{ width:18, height:18, borderWidth:3, borderColor:'var(--text3)', borderTopColor:'transparent' }} />
    </div>
  );

  return (
    <div style={{ background:'var(--bg)', minHeight:'100vh', borderLeft:'1px solid var(--border)', borderRight:'1px solid var(--border)' }}>
      {showSettings && <SettingsModal
        onClose={()=>setShowSettings(false)} currentUser={currentUser}
        tagGroups={tagGroups} setTagGroups={handleSetTagGroups}
        categories={categories} setCategories={handleSetCategories}
        onSettingsSaved={handleSettingsSaved}
        items={items} outfits={outfits}
      />}

      {/* Top nav */}
      <div className="top-nav">
        <div className="nav-tabs">
          {TABS.map(t => (
            <button key={t.id} className={`nav-tab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
          ))}
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:11, color:'var(--text3)', letterSpacing:'0.02em' }}>{displayName}</span>
          <button className="settings-btn" onClick={()=>setShowSettings(true)}>⚙</button>
          <button style={{ padding:'4px 10px', fontSize:11, color:'var(--text3)', border:'1px solid var(--border2)', borderRadius:'var(--radius)' }} onClick={onLogout}>Sign out</button>
        </div>
      </div>

      {/* Banners */}

      {/* Tab content */}
      {tab==='wardrobe' && <WardrobeTab items={items} onSaveItem={handleSaveItem} onDeleteItem={handleDeleteItem} onSaveBulkItems={handleSaveBulkItems} cloudConfig={cloudConfig} categories={categories} tagGroups={tagGroups} />}
      {tab==='builder'  && <BuilderTab  items={items} onSaveOutfit={handleSaveOutfit} tagGroups={tagGroups} categories={categories} />}
      {tab==='outfits'  && <OutfitsTab  outfits={outfits} onSaveOutfit={handleSaveOutfit} onDeleteOutfit={handleDeleteOutfit} onLogWear={handleLogWear} items={items} cloudConfig={cloudConfig} tagGroups={tagGroups} categories={categories} />}
    </div>
  );
}

/* ── App Shell ── */
function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    db.auth.getSession().then(({ data:{ session } }) => {
      setCurrentUser(session?.user || null);
      setLoading(false);
    });
  }, []);

  const handleLogout = async () => {
    await db.auth.signOut();
    setCurrentUser(null);
  };

  if (loading) return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', minHeight:'100vh', background:'var(--bg3)' }}>
      <span className="spinner" style={{ width:18, height:18, borderWidth:3, borderColor:'var(--text3)', borderTopColor:'transparent' }} />
    </div>
  );

  if (!currentUser) return <LoginScreen onLogin={setCurrentUser} />;
  return <MainApp key={currentUser.id} currentUser={currentUser} onLogout={handleLogout} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js');
}
</script>
</body>
</html>
